name: Next.js CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the latest code
      - name: Checkout Repo
        uses: actions/checkout@v3

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # 4. Build Next.js
      - name: Build Next.js
        run: npm run build

      # 5. Build Docker Image
      - name: Build Docker Image
        run: docker build -t nextjs-app .

      # 6. Login & Push Docker Image to Docker Hub
      - name: Push Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
          docker tag nextjs-app:latest $DOCKER_USERNAME/nextjs-app:latest
          docker push $DOCKER_USERNAME/nextjs-app:latest

      # 7. Deploy to server via SSH
      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "Deploying Next.js Docker container..."
            mkdir -p /home/${{ secrets.SERVER_USER }}/nextjs-app
            cd /home/${{ secrets.SERVER_USER }}/nextjs-app
            # Stop & remove previous container
            docker stop nextjs-app || true
            docker rm nextjs-app || true
            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/nextjs-app:latest
            # Run container
            docker run -d -p 3000:3000 --name nextjs-app ${{ secrets.DOCKER_USERNAME }}/nextjs-app:latest
